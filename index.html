<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bhumika 💖</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ec4899">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:linear-gradient(135deg,#fdf2f8,#fce7f3);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:white;border-radius:24px;padding:32px;max-width:400px;width:100%;box-shadow:0 20px 40px rgba(236,72,153,0.2);text-align:center}
.logo{width:80px;height:80px;background:linear-gradient(135deg,#ec4899,#8b5cf6);border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:40px;color:white;font-weight:bold}
h1{color:#ec4899;margin-bottom:8px}
p{color:#666;margin-bottom:24px}
.btn{background:linear-gradient(135deg,#ec4899,#8b5cf6);color:white;border:none;padding:14px 28px;border-radius:12px;font-size:16px;font-weight:600;width:100%;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<div class="logo">B</div>
<h1>Bhumika 💖</h1>
<p>Your Personal AI Companion<br>Always with you ✨</p>
<button class="btn">Open Bhumika 💕</button>
<p style="margin-top:16px;font-size:12px;color:#999">Made with love by Nitin</p>
</div>
</body>
</html>

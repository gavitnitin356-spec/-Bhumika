<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ec407a">
  <title>Bhumika 💖</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #fff1f3; color: #333; }
    .app { max-width: 600px; margin: auto; height: 100vh; display: flex; flex-direction: column; background: #fff; }
    header { padding: 14px; background: linear-gradient(120deg, #ec407a, #f43f5e); color: #fff; display: flex; align-items: center; gap: 10px; }
    .avatar { width: 44px; height: 44px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 22px; }
    header h2 { font-size: 19px; }
    header small { opacity: .9; }
    main { flex: 1; overflow-y: auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 85%; padding: 12px 15px; border-radius: 14px; line-height: 1.4; word-break: break-word; font-size: 15px; }
    .bot { align-self: flex-start; background: #fce7f3; border-bottom-left-radius: 4px; color: #831843; }
    .user { align-self: flex-end; background: #ec407a; color: #fff; border-bottom-right-radius: 4px; }
    .welcome { text-align: center; color: #a04065; font-size: 14px; margin: 14px 0; }
    form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #f3cfe4; background: #fff; }
    input { min-width: 0; flex: 1; border: 1px solid #edc9dc; border-radius: 24px; padding: 12px 18px; outline: none; font-size: 15px; }
    button { border: 0; border-radius: 50%; width: 46px; height: 46px; background: #ec407a; color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    footer { text-align: center; padding: 7px; color: #a04065; font-size: 12px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="avatar">💖</div>
      <div>
        <h2>Bhumika</h2>
        <small>Tumhari personal companion ✨</small>
      </div>
    </header>

    <main id="chat">
      <div class="welcome">Aaj ki baat yahin se shuru karte hain!</div>
      <div class="msg bot">Hello! 💖 Main Bhumika hoon. Kaho, aaj ka din kaisa raha?</div>
    </main>

    <form id="form">
      <input id="message" placeholder="Bhumika se baat karo..." autocomplete="off" />
      <button type="button" id="micBtn" aria-label="Mic">🎤</button>
      <button type="submit" aria-label="Send">➔</button>
    </form>
    <footer>Bhumika 💖</footer>
  </div>

  <script>
    const BACKEND_URL = "https://script.google.com/macros/s/AKfyrbebkRmrvlkOUNkv7RiVCmnQZ_yCsKNWUEYpSivCOR3Gfs-V2ktm1PdwyrlLdK_Z-vO6/exec";
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("message");
    const micBtn = document.getElementById("micBtn");

    function addMessage(text, sender) {
      const div = document.createElement("div");
      div.className = `msg ${sender}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    // Bhumika ki awaaz (Voice Output)
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const cleanText = text.replace(/[*_#]/g, '');
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'hi-IN';
        utterance.rate = 0.95;
        
        const voices = window.speechSynthesis.getVoices();
        const hiVoice = voices.find(v => v.lang.includes('hi') || v.lang.includes('IN'));
        if (hiVoice) utterance.voice = hiVoice;
        
        window.speechSynthesis.speak(utterance);
      }
    }

    // Mic (Aapki bolne ki aawaz record karne ke liye)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'hi-IN';
      recognition.continuous = false;

      micBtn.onclick = () => {
        micBtn.textContent = "🔴";
        recognition.start();
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        input.value = transcript;
        micBtn.textContent = "🎤";
        form.dispatchEvent(new Event('submit'));
      };

      recognition.onerror = () => {
        micBtn.textContent = "🎤";
      };

      recognition.onend = () => {
        micBtn.textContent = "🎤";
      };
    } else {
      micBtn.style.display = "none";
    }

    form.addEventListener("submit", async function(e) {
      e.preventDefault();
      const value = input.value.trim();
      if (!value) return;

      addMessage(value, "user");
      input.value = "";

      const loadingDiv = addMessage("Soch rahi hoon...", "bot");

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 35000);

      try {
        const fullUrl = BACKEND_URL + "?message=" + encodeURIComponent(value);
        const res = await fetch(fullUrl, {
          method: "GET",
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        const data = await res.json();
        const replyText = data.reply || "Kuch samajh nahi aaya!";
        loadingDiv.textContent = replyText;
        speakText(replyText);
      } catch (err) {
        clearTimeout(timeoutId);
        if (err.name === "AbortError") {
          loadingDiv.textContent = "Internet thoda slow chal raha hai, ek baar dubara bhej kar dekhein 🌸";
        } else {
          loadingDiv.textContent = "Network issue aa gaya, ek baar connection check kar lo 🌸";
        }
      }
    });
    </script>
</body>
</html>

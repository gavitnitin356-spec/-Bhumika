
name: Build Bhumika APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking Bhumika project..."
          ls -la

      - name: Check for Android Gradle project
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Android Gradle project not found."
            echo "This website-only repository needs an Android wrapper first."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bhumika-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          
